<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f8f4" />
    <meta name="description" content="Code Geist — an observable coding agent workbench. From a task to a verified patch, with every step in view." />
    <title>Code Geist · Coding workbench</title>
    <script>
      try {
        const theme = localStorage.getItem('code-geist-theme');
        document.documentElement.dataset.theme = theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
